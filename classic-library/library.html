>\n<\/ol>\n<p>   <em>활용 각도: 공정경쟁·규제 담론, &#x27;진짜 애덤 스미스&#x27; 재조명 콘텐츠.<\/em><\/p>\n<ol>\n<li><strong>분업의 그늘도 먼저 봤다.<\/strong> 평생 한 가지 단순 작업만 반복하는 노동자는 판단력이 무뎌진다고 경고하며 공교육을 처방했다. 소외 개념과 리스킬링 담론의 원형이 마르크스 이전에 이미 있었다.<\/li>\n<\/ol>\n<p>   <em>활용 각도: 일의 의미, 직무 재설계, 평생교육·리스킬링 기획.<\/em><\/p>\n<ol>\n<li><strong>국부의 재정의 — 스톡이 아니라 플로우.<\/strong> 부는 쌓아둔 자산이 아니라 생산하고 교환하는 흐름이다. 개인 커리어에도 적용 가능한 은유: 스펙(스톡)이 아니라 생산 능력(플로우)이 자산이다.<\/li>\n<\/ol>\n<p>   <em>활용 각도: 커리어 강연, 국가경쟁력 담론, 기업가치 평가 은유.<\/em><\/p>\n<h3>기획·강연 활용 포인트<\/h3>\n<ul>\n<li><strong>&#x27;보이지 않는 손&#x27; 오해 풀기 자체가 콘텐츠<\/strong>: 책에 한 번 나온 표현이 책 전체로 오해된 과정을 보여주면, &#x27;원전을 읽어야 하는 이유&#x27;라는 메타 메시지까지 전달된다.<\/li>\n<li><strong>핀 공장 → 포드 컨베이어벨트 → 글로벌 공급망 → AI 에이전트 분업<\/strong>으로 이어지는 250년 타임라인 구성은 산업 변화 강연의 검증된 뼈대.<\/li>\n<li><strong>주의점<\/strong>: 스미스를 시장만능주의의 근거로 인용하는 것은 오독이다. 그는 『도덕감정론』에서 공감(sympathy)을 인간 본성의 기초로 놓았다. 균형 있는 인용 필요.<\/li>\n<\/ul>\n<h3>대표 개념·프레임워크<\/h3>\n<ul>\n<li>분업 (division of labor) — 생산성의 구조적 원천<\/li>\n<li>보이지 않는 손 — 분산된 이기심의 사회적 조정<\/li>\n<li>시장 크기와 전문화의 비례 법칙<\/li>\n<li>교환 성향 — 인간을 다른 동물과 구분하는 특성<\/li>\n<li>자연가격 vs 시장가격 — 가치와 가격의 구분<\/li>\n<\/ul>\n<h3>연결 독서<\/h3>\n<p>종의 기원(분산된 개체 행동이 질서를 만든다는 구조적 유사성), 프로테스탄트 윤리(후보 목록 — 일의 의미로 확장), 목민심서(공공 행정의 관점과 대비).<\/p>"}, {"title": "열하일기", "full_title": "열하일기 (熱河日記)", "author": "박지원(朴趾源)", "era": "1780년(조선 정조 4년), 청나라 건륭제 칠순 축하 사절단 동행 기록", "category": "한국고전·기행", "tags": ["실학", "개방성", "관찰력", "자기혁신", "이용후생"], "reliability": "원전기반", "vertical": true, "bg": "#33313F", "ink": "#EBE7DE", "acc": "#AD9660", "one": "조선 선비가 청나라 국경을 넘으며 자신의 세계관이 무너지고 재조립되는 과정을 기록한, 동아시아 지성사에서 가장 정직한 '해외 벤치마킹' 보고서.", "html": "<h2>열하일기<\/h2>\n<p><strong>한 줄 정의:<\/strong> 조선 선비가 청나라 국경을 넘으며 자신의 세계관이 무너지고 재조립되는 과정을 기록한, 동아시아 지성사에서 가장 정직한 &#x27;해외 벤치마킹&#x27; 보고서.<\/p>\n<h3>개요<\/h3>\n<p>연암 박지원이 1780년 삼종형 박명원을 따라 청나라 건륭제 칠순 축하 사절단의 일원으로 북경, 그리고 황제의 여름 별궁이 있던 열하(熱河, 지금의 청더)까지 다녀오며 남긴 기행문이다.⚠️ (사절단 구성 및 저자의 정확한 직책·수행 경로 세부 사항) 단순 여행기가 아니라 실학·북학파(北學派)를 대표하는 저작으로, 청나라의 벽돌집·수레·도로·상업 조직 같은 &#x27;오랑캐&#x27;로 얕보던 나라의 앞선 문물을 있는 그대로 관찰하고 조선의 낙후를 정면으로 비판한다. 형식 면에서도 파격적이다. 기행일기, 인물 대화, 필담(筆談), 삽입 소설(허생전 등)이 뒤섞여 있어 하나의 장르로 규정하기 어렵고, 이 잡종성 자체가 연암 문체의 특징으로 꼽힌다.⚠️ (허생전이 열하일기 내 정확히 어느 편에 어떤 형태로 수록되었는지의 세부 편제)<\/p>\n<h3>핵심 인사이트<\/h3>\n<ol>\n<li><strong>이용후생(利用厚生) — 백성의 삶을 이롭게 하는 것이 학문의 목적이다.<\/strong> 연암은 도구와 기술, 유통 체계처럼 &#x27;실용&#x27;을 경시하던 당대 성리학 풍토에 맞서, 쓰임을 이롭게 하고 삶을 두텁게 하는 것이야말로 학문의 본령이라 주장한다.<\/li>\n<\/ol>\n<p>   <em>활용 각도: 실용주의 조직문화, R&amp;D의 존재 이유, &#x27;왜 우리는 이 일을 하는가&#x27; 강연 도입.<\/em><\/p>\n<ol>\n<li><strong>고정관념 없는 벤치마킹 — 벽돌 한 장, 수레 한 대를 부러워할 줄 아는 태도.<\/strong> 연암은 청나라의 벽돌 쌓는 법, 수레의 규격, 거름 처리 방식까지 세밀히 관찰하고 기록한다. 상대가 정치적으로 &#x27;오랑캐&#x27;라는 이유로 그 기술까지 폄하하지 않는 태도가 핵심이다.<\/li>\n<\/ol>\n<p>   <em>활용 각도: 경쟁사/타국 벤치마킹 워크숍, 진영논리를 배제한 학습 태도 담론.<\/em><\/p>\n<ol>\n<li><strong>호곡장론(好哭場論) — 큰 세계를 만나면 울고 싶어진다.<\/strong> 광활한 요동 벌판을 처음 마주한 연암은 한바탕 울고 싶은 자리라는 취지의 소회를 남긴다.⚠️ (정확한 원문 표현과 어순은 인용하지 않고 취지만 서술) 좁은 세계관이 깨지는 순간의 감정을 숨기지 않고 기록했다는 점에서, 지적 충격과 확장을 정직하게 언어화한 드문 사례다.<\/li>\n<\/ol>\n<p>   <em>활용 각도: 해외 연수·유학 경험담, 관점 확장(paradigm shift)을 설명하는 오프닝 인용.<\/em><\/p>\n<ol>\n<li><strong>도강록(渡江錄)의 인식론 — 경계를 넘는 행위 자체에 대한 성찰.<\/strong> 연암은 압록강을 건너는 첫 대목에서부터 &#x27;안다는 것&#x27;과 &#x27;본다는 것&#x27;의 차이, 관찰자의 위치가 인식을 어떻게 바꾸는지를 짚는다.⚠️ (편명 &#x27;도강록&#x27;의 정확한 구성과 해당 대목의 세부 내용)<\/li>\n<\/ol>\n<p>   <em>활용 각도: 관찰자 편향, 낯선 환경에서의 인식론적 겸손을 다루는 강연.<\/em><\/p>\n<ol>\n<li><strong>양반 사회 풍자 — 웃음으로 찌르는 비판.<\/strong> 삽입된 이야기들은 형식과 명분에 갇힌 당대 지배층의 허례를 유머와 반어로 비튼다. 정색한 비판보다 이야기 형식의 풍자가 더 오래 살아남는다는 것을 보여준다.<\/li>\n<\/ol>\n<p>   <em>활용 각도: 조직 내 관행 비판, 스토리텔링을 통한 우회적 메시지 전달.<\/em><\/p>\n<ol>\n<li><strong>필담(筆談)이라는 소통 방식 — 말이 통하지 않아도 문자로 연결된다.<\/strong> 연암은 청나라 지식인들과 한자로 필담을 나누며 깊은 교류를 나눈다. 언어 장벽을 넘어서는 매개체를 스스로 만든 셈이다.<\/li>\n<\/ol>\n<p>   <em>활용 각도: 공통 프로토콜/공용어의 힘, 크로스보더 협업 사례.<\/em><\/p>\n<h3>기획·강연 활용 포인트<\/h3>\n<ul>\n<li><strong>&#x27;낯선 나라를 만난 기록&#x27;이라는 훅이 강력하다<\/strong>: 실학자가 청나라를 여행하며 조선의 민낯을 발견하는 서사는 해외 출장·유학·이문화 경험을 다루는 강연의 도입부로 바로 쓸 수 있다.<\/li>\n<li><strong>벤치마킹의 원형 사례로 제시<\/strong>: 벽돌·수레 등 구체적 물건에서 출발해 제도·태도의 개선까지 나아가는 전개는 &#x27;작은 관찰에서 큰 통찰로&#x27;라는 강연 구조에 적합하다.<\/li>\n<li><strong>주의점<\/strong>: 열하일기는 26권에 이르는 방대한 기행·필담·소설의 묶음이며,⚠️ (전체 권수는 판본마다 다르게 소개되어 정확한 숫자 단정 어려움) 이 카드에서 다루는 이용후생·호곡장·도강록 등은 그 일부 대표 대목일 뿐이다. 강연에서 인용할 때는 원문을 재확인하고, &#x27;열하일기 전체가 이 논지 하나로 수렴된다&#x27;는 식의 단순화를 피해야 한다.<\/li>\n<\/ul>\n<h3>대표 개념·프레임워크<\/h3>\n<ul>\n<li>이용후생(利用厚生) — 실용이 곧 학문의 목적이라는 실학의 핵심 명제<\/li>\n<li>북학(北學) — 청나라의 앞선 문물을 배우자는 학파적 태도<\/li>\n<li>개방적 벤치마킹 — 정치적 반감과 기술적 학습을 분리하는 관찰법<\/li>\n<li>호곡장론 — 큰 세계와의 마주침이 주는 지적 충격의 언어화<\/li>\n<\/ul>\n<h3>연결 독서<\/h3>\n<p>목민심서(같은 실학 계열이지만 국내 행정 실무 대 해외 견문이라는 대비축), 도덕경·장자(무위·탈속의 사유와 대비되는 이용후생의 실용주의), 논어(전통 유학이 실학으로 어떻게 굴절되는지 보는 비교축).<\/p>"}, {"title": "장자", "full_title": "장자 (莊子)", "author": "장자(내편), 후학 편찬(외편·잡편)", "era": "기원전 4세기경, 중국 전국시대", "category": "동양사상", "tags": ["자유", "상대주의", "무위", "소요유", "물아일체"], "reliability": "원전기반", "vertical": true, "bg": "#4A2E33", "ink": "#F0E8D8", "acc": "#C3A15F", "one": "세상의 크고 작음, 옳고 그름을 가르는 인간의 기준 자체를 상대화하여, 그 어떤 것에도 얽매이지 않는 절대적 자유(逍遙遊)에 이르는 길을 우화로 풀어낸 텍스트.", "html": "<h2>장자<\/h2>\n<p><strong>한 줄 정의:<\/strong> 세상의 크고 작음, 옳고 그름을 가르는 인간의 기준 자체를 상대화하여, 그 어떤 것에도 얽매이지 않는 절대적 자유(逍遙遊)에 이르는 길을 우화로 풀어낸 텍스트.<\/p>\n<h3>개요<\/h3>\n<p>장자는 도덕경과 함께 도가 사상의 양대 경전으로 꼽히지만, 문체와 태도는 크게 다르다. 도덕경이 짧은 잠언으로 통치·처세의 원리를 압축한다면, 장자는 우화(寓言)와 긴 이야기로 사유를 풀어낸다. 전체는 내편(內篇)·외편(外篇)·잡편(雜篇)으로 구성되며 ⚠️(정확한 편수 구성은 판본에 따라 차이가 있어 통설을 요약한 것임), 내편이 장자 본인의 사상에 가장 가깝고 외편·잡편은 후학들이 그의 사상을 부연·확장한 것으로 보는 것이 일반적인 견해다 ⚠️(내편/외편/잡편의 저자 구분 자체가 학계 정설이 아니라 유력한 통설임을 유의). 노자가 &#x27;무위&#x27;로 통치와 처세의 전략을 말했다면, 장자는 그 무위를 개인의 정신적 자유와 만물이 하나라는 물아일체(物我一體)의 경지로 확장한다. 도덕경이 조직·리더십에 적용하기 좋은 텍스트라면, 장자는 개인의 관점 전환·창의성·직업관에 적용하기 좋은 텍스트다.<\/p>\n<h3>핵심 인사이트<\/h3>\n<ol>\n<li><strong>절대적 자유 — 逍遙遊.<\/strong> 북쪽 바다의 물고기 곤(鯤)이 붕(鵬)이라는 거대한 새로 변해 구만리 창공을 날아오른다는 이야기로 문을 연다. 매미와 비둘기는 그 큰 날갯짓을 비웃지만, 이는 크기의 문제가 아니라 각자가 갇힌 그릇의 문제임을 보여준다.<\/li>\n<\/ol>\n<p>   <em>활용 각도: 관점의 스케일 확장, 큰 도전에 대한 조직 내 냉소 다루기, 비전 강연의 오프닝.<\/em><\/p>\n<ol>\n<li><strong>관점의 상대성 — 齊物論.<\/strong> 옳고 그름, 크고 작음은 보는 자리에 따라 달라지는 상대적 기준일 뿐 절대적 잣대가 아니라는 사상. 만물을 가지런히(齊) 바라보는 태도를 제안한다.<\/li>\n<\/ol>\n<p>   <em>활용 각도: 갈등 조정, 관점 전환 워크숍, &quot;누구의 기준인가&quot;를 묻는 토론 설계.<\/em><\/p>\n<ol>\n<li><strong>나비의 꿈 — 胡蝶之夢.<\/strong> 장자가 꿈에서 나비가 되어 즐겁게 노닐다 깨어나서는, 자신이 나비 꿈을 꾼 것인지 나비가 장자가 된 꿈을 꾸는 것인지 알 수 없다고 말한다 ⚠️(제물론 말미의 이 우화는 원문이 매우 함축적이어서 통용되는 취지로 요약함). 자아와 세계의 경계가 고정된 것이 아니라는 물아일체 사상의 상징이다.<\/li>\n<\/ol>\n<p>   <em>활용 각도: 정체성·역할 전환 담론, 자아 재정의 세션의 상징적 오프닝.<\/em><\/p>\n<ol>\n<li><strong>포정해우 — 庖丁解牛.<\/strong> 백정 포정이 소를 잡을 때 눈으로 보지 않고 결(理)을 따라 칼을 놀려, 19년 쓴 칼날이 방금 숫돌에 간 것 같다고 말한다 ⚠️(&quot;19년&quot;이라는 구체적 연수는 원문 인용 시 재확인 필요). 기술이 극에 달하면 억지 힘이 아니라 사물의 결을 따르는 무위의 경지에 이른다는 비유.<\/li>\n<\/ol>\n<p>   <em>활용 각도: 전문성·숙련 서사, 몰입(flow) 경험 설명, &quot;노력보다 결을 읽는 힘&quot; 강연.<\/em><\/p>\n<ol>\n<li><strong>쓸모없음의 쓸모 — 無用之用.<\/strong> 옹이투성이라 목수도 거들떠보지 않는 큰 나무가, 바로 그 쓸모없음 덕분에 베이지 않고 천수를 누린다는 이야기 ⚠️(이 우화는 소요유·인간세 등 여러 편에 유사한 형태로 등장하여 정확한 출전 하나를 특정하기 어려움). 효용의 기준 자체를 뒤집는 발상이다.<\/li>\n<\/ol>\n<p>   <em>활용 각도: 비주류 인재·비정형 역량의 가치 재조명, 성과주의에 대한 반론, 여백·휴식의 가치.<\/em><\/p>\n<ol>\n<li><strong>우물 안 개구리 — 井蛙.<\/strong> 우물 안 개구리에게는 바다를 말할 수 없으니, 그가 좁은 공간에 갇혀 있기 때문이라는 비유 ⚠️(추수편의 구절로 알려져 있으나 정확한 편명·원문은 재확인 필요). 자신이 아는 세계가 전부라 믿는 인식의 한계를 지적한다.<\/li>\n<\/ol>\n<p>   <em>활용 각도: 조직의 관성·업계 인식 한계 지적, 외부 시각 도입의 필요성 강연.<\/em><\/p>\n<h3>기획·강연 활용 포인트<\/h3>\n<ul>\n<li><strong>도덕경과 짝지어 쓰면 도가 사상의 스펙트럼을 보여주기 좋다<\/strong>: 도덕경(조직·통치의 무위) → 장자(개인·정신의 자유)로 이어지는 흐름은 &quot;조직을 다스리는 법&quot;에서 &quot;나 자신을 다스리는 법&quot;으로 전환하는 강연 목차로 쓰기 좋다.<\/li>\n<li><strong>우화 자체가 이미 강연 소재다<\/strong>: 붕새, 나비, 포정, 큰 나무 이야기는 시각화·스토리텔링이 쉬운 소재라 슬라이드나 인트로 영상으로 활용하기 좋다.<\/li>\n<li><strong>주의점<\/strong>: 장자의 상대주의(제물론)를 &quot;옳고 그름이 없으니 아무래도 상관없다&quot;는 허무주의·냉소주의로 오독하지 않도록 주의해야 한다. 장자의 요지는 기준의 절대화를 경계하는 것이지 판단 자체를 포기하라는 것이 아니다. 또한 편별 저자 귀속과 개별 우화의 정확한 출전은 판본에 따라 이견이 있으므로 ⚠️ 표시된 부분은 인용 전 재확인이 필요하다.<\/li>\n<\/ul>\n<h3>대표 개념·프레임워크<\/h3>\n<ul>\n<li>소요유(逍遙遊) — 조건에 얽매이지 않는 절대적 자유<\/li>\n<li>제물론(齊物論) — 시비·대소의 상대성<\/li>\n<li>무용지용(無用之用) — 쓸모없음의 역설적 쓸모<\/li>\n<li>물아일체(物我一體) — 자아와 세계의 경계 해체<\/li>\n<li>심재(心齋)·좌망(坐忘) — 마음을 비워 도에 이르는 수양법 ⚠️(두 개념의 정확한 출전 편과 상세 정의는 재확인 필요)<\/li>\n<\/ul>\n<h3>연결 독서<\/h3>\n<p>도덕경(무위 사상의 원류이자 통치·처세 중심 텍스트), 논어(적극적 개입과 예禮 중심의 유가 사상과의 대비축 — 도가의 자유방임 vs 유가의 규범적 질서).<\/p>"}];

let cat="전체", q="";
const chips=document.getElementById("chips"), shelf=document.getElementById("shelf");
["전체",...CATS].forEach(c=>{const b=document.createElement("button");b.className="chip"+(c==="전체"?" on":"");b.textContent=c;b.onclick=()=>{cat=c;document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===b));draw()};chips.insertBefore(b,document.getElementById("q"))});
document.getElementById("q").addEventListener("input",e=>{q=e.target.value.trim().toLowerCase();draw()});
function match(b){const inCat=cat==="전체"||b.category.startsWith(cat);const hay=(b.title+b.author+b.category+(b.tags||[]).join(" ")).toLowerCase();return inCat&&(!q||hay.includes(q))}
function draw(){
  const list=BOOKS.filter(match);
  document.getElementById("count").textContent=list.length+" / "+BOOKS.length+"권";
  shelf.innerHTML="";
  if(!list.length){shelf.innerHTML='<div class="empty">이 조건에 맞는 책이 아직 서가에 없습니다. 검색어를 지우거나 다른 분야를 눌러보세요.</div>';return}
  list.forEach((b,i)=>{
    const el=document.createElement("button");el.className="slot";
    el.innerHTML=`<div class="cover ${b.vertical?"v":""}" style="background:${b.bg};color:${b.ink}">
      <div class="frame" style="border-color:${b.acc}"></div>
      <div class="t">${b.title}</div><div class="a">${b.author}</div>
      ${b.vertical?`<div class="seal">${b.title[0]||""}</div>`:""}
    </div>
    <div class="meta"><div class="bt"><span class="badge b-${b.reliability}"></span>${b.title}</div><div class="bs">${b.author} · ${b.category}</div></div>`;
    el.onclick=()=>open(b);
    shelf.appendChild(el);
  });
}
function open(b){
  document.getElementById("dcat").textContent=b.category+" · "+b.era+" · "+b.reliability;
  document.getElementById("dtitle").textContent=b.full_title||b.title;
  document.getElementById("dwho").textContent=b.author;
  document.getElementById("dbody").innerHTML=b.html;
  document.getElementById("dbody").scrollTop=0;
  dlg.showModal();
}
draw();
</script>
</body>
</html>
